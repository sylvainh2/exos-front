<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style7.css">
    <script src="https://kit.fontawesome.com/9b536c3220.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="header">
        <div class="appTitle"><i class="fa-brands fa-files-pinwheel wheel orange"></i>Wheather Now</div>
        <div class="langage"><i class="fa-solid fa-gear"></i>Units<i class="fa-solid fa-angle-down choice"></i></div>
    </div>
    <h1>How's the sky looking today?</h1>
    <section class="form">
        <form action="" class="searchForm">
            <div class="searchCityCont">
                <i class="fa-solid fa-magnifying-glass mag"></i>
                <input id="searchCity" type="text" placeholder="Search for a place..." name="city">
            </div>
            <input type="submit" value="Search" id="searchBut">
        </form>
    </section>
    <section class="tiles">
        <div class="todaySection">
            <div class="todayTile">
                <div class="todayTileCard">
                    <div>
                        <div>aa</div>
                        <div>bb</div>
                    </div>
                    <div class="todayCont">
                        <div>A</div>
                        <div>B</div>
                    </div>
                </div>
            </div>
            <div class="todayInfos">
                <div class="todayInfo"></div>
                <div class="todayInfo"></div>
                <div class="todayInfo"></div>
                <div class="todayInfo"></div>
            </div>
            <h2>Daily forecast</h2>
            <div class="todayWeather">
                <div class="todayWeatherTiles"></div>
                <div class="todayWeatherTiles"></div>
                <div class="todayWeatherTiles"></div>
                <div class="todayWeatherTiles"></div>
                <div class="todayWeatherTiles"></div>
                <div class="todayWeatherTiles"></div>
                <div class="todayWeatherTiles"></div>
            </div>
        </div>
        <div class="clockSection">
            <div class="clockTitleCont">
                <div class="clockTitle">Hourly forecast</div>
                <form action="" class="day">
                    <div class="dayButCont">
                        <div id="daylist">Lundi
                        </div>
                        <i class="fa-solid fa-angle-down searchDayBut"></i>
                    </div>
                    <!-- <datalist id="daylists">
                        <option value="lundi"></option>
                        <option value="mardi"></option>
                        <option value="mercredi"></option>
                        <option value="jeudi"></option>
                        <option value="vendredi"></option>
                        <option value="samedi"></option>
                        <option value="dimanche"></option>
                    </datalist> -->
                </form>
            </div>
            <div class="clockTiles"></div>
            <div class="clockTiles"></div>
            <div class="clockTiles"></div>
            <div class="clockTiles"></div>
            <div class="clockTiles"></div>
            <div class="clockTiles"></div>
            <div class="clockTiles"></div>
            <div class="clockTiles"></div>
        </div>
    </section>
</body>
</html>
